[package]
name = "wasmcheck"
version = "0.1.2"
edition = "2024"
# Not 1.85: `wasmparser` 0.259 (used by `--top`) declares 1.88, and Cargo
# refuses to build a graph containing a package with a newer MSRV. Verified by
# the `msrv` CI job.
rust-version = "1.88"
description = "WASM bundle size budget checker — raw, gzip, brotli, CI gate"
license = "MIT OR Apache-2.0"
repository = "https://github.com/GavidetDoliath/wasmcheck"
homepage = "https://github.com/GavidetDoliath/wasmcheck"
documentation = "https://docs.rs/wasmcheck"
readme = "README.md"
keywords = ["wasm", "webassembly", "size", "ci", "bundle"]
categories = [
    "command-line-utilities",
    "development-tools::build-utils",
    "wasm",
]
# Keep the published crate to what `cargo install` and `cargo test` need.
include = [
    "/src/**",
    "/tests/**",
    "/fixtures/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "wasmcheck"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
brotli = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
thiserror = "2"
wasmparser = "0.259.0"
glob = "0.3.4"

[dev-dependencies]
serde_json = "1"
