name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Smoke check on committed fixture
        run: cargo run --quiet -- check --file fixtures/full.wasm --budget "30 KB"